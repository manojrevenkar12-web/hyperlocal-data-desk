[project]
name = "hyperlocal-data-desk"
version = "0.1.0"
description = "Data journalism desk for every municipality: pipelines, checked story leads, checked texts and interactives."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
  "scipy>=1.14",
  "shapely>=2.0",
  "duckdb>=1.1",
  "psycopg[binary]>=3.2",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  "httpx>=0.27",
  "boto3>=1.35",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13", "moto[s3]>=5.0", "types-boto3[s3]>=1.35"]

[project.scripts]
desk = "lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desk", "src/world", "src/lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["desk", "world", "lab"]
strict = true
ignore_missing_imports = true
